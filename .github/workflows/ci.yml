name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check the publishable file list
        run: npm pack --dry-run

  compat:
    name: node ${{ matrix.node }} / eslint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        eslint: ["8.57", "9", "10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install ESLint ${{ matrix.eslint }}
        # --legacy-peer-deps: the repo's own lint setup (@eslint/js 10) declares a peer on ESLint 10;
        # it is not exercised here, only the plugin's tests are.
        run: npm install --no-save --legacy-peer-deps eslint@${{ matrix.eslint }}
      - run: node -e "console.log('eslint', require('eslint/package.json').version)"
      - run: npm test
