name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Authentication: npm tries Trusted Publishing (OIDC) first and falls back to the NPM_TOKEN secret.
# OIDC needs `id-token: write`, npm >= 11.5.1 (Node 24 bundles npm 11) and a trusted publisher set up
# once on npmjs.com for this repository and this workflow file name (publish.yml); until that exists,
# the token is what authenticates. Renaming this file breaks the trusted publisher.
permissions:
  contents: read
  id-token: write # npm provenance and Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit: this job can publish to npm.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # bundles npm 11; npm 10 fails provenance signing with TLOG_CREATE_ENTRY_ERROR (409)
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm --version
      # A release event carries its tag; a manual run must be started on a tag ("Run workflow" > Tags),
      # never on a branch, so that only a tagged tree whose version matches the tag can be published.
      - name: Check that the run is on a tag that matches package.json
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.ref_type }}
        run: |
          node -e 'if (process.env.REF_TYPE !== "tag") { console.error("Refusing to publish from a " + process.env.REF_TYPE + " (" + process.env.TAG + "); run this workflow on a release tag."); process.exit(1); } const v = require("./package.json").version; const t = process.env.TAG.replace(/^v/, ""); if (v !== t) { console.error("package.json is " + v + " but the tag is " + t); process.exit(1); }'
      - name: Publish (prepublishOnly runs lint, typecheck, test and build)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
